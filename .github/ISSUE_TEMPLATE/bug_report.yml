name: Bug
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir el reporte, revisa `docs/docker.md` y la sección
        "Estado y pendientes" del README. Si el problema es de seguridad,
        no lo publiques aquí: usa el aviso privado que describe `SECURITY.md`.

  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: El comportamiento que ves, sin interpretarlo.
    validations:
      required: true

  - type: textarea
    id: que-esperabas
    attributes:
      label: Qué esperabas
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. docker compose up --build
        2. Abrir http://localhost:8000
        3. ...
    validations:
      required: true

  - type: dropdown
    id: instalacion
    attributes:
      label: Instalación
      options:
        - Docker
        - Nativa en Windows (PowerShell)
        - Nativa en Linux o macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `git describe --tags` o el tag del release que usas.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Sin claves, tokens ni rutas con tu nombre de usuario.
      render: shell
