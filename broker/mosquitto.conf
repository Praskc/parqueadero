# Broker del proyecto: solo localhost, con autenticacion.
# Rutas relativas al CWD (raiz del repo) → correr con `pnpm broker`.

listener 1883 127.0.0.1
allow_anonymous false
password_file broker/passwd

# Los payloads del contrato son ~26 bytes: 1 KB es generoso y corta
# cualquier abuso de memoria desde un cliente autenticado.
max_packet_size 1024

persistence true
persistence_location broker/data/
