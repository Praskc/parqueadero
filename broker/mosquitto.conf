# Broker del proyecto. Rutas relativas al CWD (raíz del repo) → `pnpm broker`.
#
# Dos superficies separadas:
#   1883  loopback  → backend, con usuario/clave y ACL (nunca sale de la máquina).
#   8883  0.0.0.0   → nodos sensores, mTLS obligatorio; el certificado ES la identidad.
#
# Mosquitto 2.1 deprecó `password_file`, `acl_file` y `per_listener_settings`
# (se retiran en 3.0). Se usan los plugins equivalentes, cargados una vez y
# aplicados a cada listener con `plugin_use`:
#   - passwd: solo en 1883, porque los nodos no usan contraseña.
#   - acl:    en ambos, para que el backend no pueda publicar como sensor y
#             cada nodo solo pueda escribir las bahías que tiene asignadas.

plugin_load passwd C:\Program Files\Mosquitto\mosquitto_password_file.dll
plugin_opt_password_file broker/passwd

plugin_load acl C:\Program Files\Mosquitto\mosquitto_acl_file.dll
plugin_opt_acl_file broker/acl

# ---------------------------------------------------------------- backend local
listener 1883 127.0.0.1
listener_allow_anonymous false
plugin_use passwd
plugin_use acl

# ------------------------------------------------------- nodos sensores (mTLS)
# Para abrirlo:
#   1. `pnpm mqtt:provision` (genera CA, certificados y ACL).
#   2. Reiniciar `pnpm broker`.
#   3. Abrir el puerto 8883 solo para la subred del hotspot en el firewall de Windows.
#      (Mosquitto en Windows no tiene `bind_interface`; se acota con el firewall.)
#
# `require_certificate true` rechaza en el handshake a quien no presente un
# certificado firmado por nuestra CA. `use_identity_as_username true` toma el CN
# del certificado como usuario MQTT: la ACL se escribe por `user <CN>` y la
# contraseña deja de usarse. Una clave filtrada sin su certificado no sirve.
#
listener 8883 0.0.0.0
listener_allow_anonymous false
cafile broker/certs/ca.crt
certfile broker/certs/server.crt
keyfile broker/certs/server.key
require_certificate true
use_identity_as_username true
plugin_use acl
tls_version tlsv1.2
log_type all
connection_messages true

# Los payloads del contrato son ~26 bytes: 1 KB es generoso y corta cualquier
# abuso de memoria desde un cliente autenticado.
max_packet_size 1024

# Techo de clientes simultáneos: 1 backend + 30 nodos + margen de diagnóstico.
max_connections 64

persistence true
persistence_location broker/data/
