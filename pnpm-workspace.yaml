packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - better-sqlite3

# Parches de seguridad sobre dependencias transitivas (pnpm 11 los lee aquí).
#   fast-uri  -> GHSA-333x-w4r6-6crp (suplantación de esquema URI)
#   ip-address-> GHSA (DoS con identificadores de zona IPv6)
overrides:
  ajv>fast-uri: 3.1.9
  "@fastify/ajv-compiler>fast-uri": 4.2.3
  fast-json-stringify>fast-uri: 4.2.3
  socks>ip-address: 10.7.4
