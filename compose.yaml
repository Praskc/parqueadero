# Stack completo del parqueadero: broker MQTT + backend Fastify + HMI servida
# por el propio backend. Un solo comando lo levanta todo:
#
#   docker compose up --build
#
# La primera vez, el servicio `mqtt-init` genera la PKI, el usuario del broker,
# la ACL y las claves (.env). Después el broker y la app arrancan solos.
#
# Endurecimiento: broker y app corren sin privilegios, con el sistema de
# archivos de solo lectura, sin capabilities y sin poder escalar privilegios.
# El único servicio que escribe en el repo es `mqtt-init`, que termina solo.
#
# En Linux, si quieres que los archivos generados en el repo no queden como
# root:  DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) docker compose up --build

name: parqueadero

services:
  # ------------------------------------------------------------ aprovisionamiento
  # Genera CA, certificados, ACL, broker/passwd y las claves en .env.
  # Se ejecuta una vez por cada `up` y termina con código 0.
  # Es el único servicio con escritura sobre el repo, por eso conserva
  # capabilities: tiene que poder crear archivos propiedad del usuario.
  mqtt-init:
    build:
      context: .
      dockerfile: broker/Dockerfile
    image: parqueadero-broker:local
    command: ["bash", "/repo/scripts/provision-mqtt.sh"]
    environment:
      # La clave vive en .env (la genera el provisioning); aquí solo se interpola.
      MQTT_USER: "${MQTT_USER:-backend}"
      MQTT_PASS: "${MQTT_PASS}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
    volumes:
      - .:/repo
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: "no"

  # ------------------------------------------------------------------- broker
  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    image: parqueadero-broker:local
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    environment:
      # Igual que el backend: la clave vive en .env, no incrustada aquí.
      MQTT_USER: "${MQTT_USER:-backend}"
      MQTT_PASS: "${MQTT_PASS}"
      # 1 = abre el listener 8883 con mTLS para los nodos ESP32.
      NODES_LISTENER: "${NODES_LISTENER:-1}"
    ports:
      # Solo desde la máquina: el backend entra por la red interna de compose.
      - "127.0.0.1:1883:1883"
      # Nodos sensores (mTLS). Abierto en la red local para el ESP32.
      - "8883:8883"
    volumes:
      # Solo lectura: el broker no modifica el repo.
      - .:/repo:ro
      - broker-data:/mosquitto/data
    user: "1883:1883"
    read_only: true
    tmpfs:
      - /mosquitto:uid=1883,gid=1883,mode=0755
      - /tmp:uid=1883,gid=1883,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mosquitto_pub -h 127.0.0.1 -p 1883
          -u "$$MQTT_USER" -P "$$MQTT_PASS"
          -t 'parq/lote1/backend/comandos/healthcheck' -m ok
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------- app
  # Backend Fastify + HMI compilada (la sirve el mismo backend en /).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: parqueadero-app:local
    env_file:
      - .env
    depends_on:
      broker:
        condition: service_healthy
    environment:
      MQTT_URL: mqtt://broker:1883
      HOST: 0.0.0.0
      PORT: 8000
      DB_PATH: /data/parqueadero.db
    ports:
      - "8000:8000"
    volumes:
      # Solo lectura: la app únicamente lee las claves de /repo/.env.
      - .:/repo:ro
      - app-data:/data
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  broker-data:
  app-data:
